services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - psybeam-data:/app/data
    environment:
      - PSYBEAM_DB_PATH=/app/data/psybeam.db
      # Optional Discord alerts
      # - PSYBEAM_DISCORD_WEBHOOK_URL=https://discord.com/api/webhooks/...

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  psybeam-data: